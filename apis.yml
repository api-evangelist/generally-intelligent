aid: generally-intelligent
name: Generally Intelligent
description: >-
  Generally Intelligent is the former name of Imbue, the San Francisco AI research lab
  founded in 2021 by Kanjun Qiu and Josh Albrecht to build agentic reasoning models and
  the tooling around them. The company rebranded to Imbue in 2023; its original domain
  generallyintelligent.com now redirects permanently to imbue.com, and every product,
  research release and open-source repository that began under the Generally Intelligent
  name (the Avalon RL benchmark, CARBS hyperparameter tuning, jupyter_ascending) is
  published today under the Imbue brand and the github.com/imbue-ai organization. Neither
  name has ever shipped a public, credentialed developer API: there is no OpenAPI, GraphQL,
  MCP, A2A agent card or llms.txt on any host the company controls, and integration happens
  through open-source repositories, model artifacts on Hugging Face and research releases.
  The living profile for this company is all/imbue.
